<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            /* border: 1px solid black; */
            display: flex;
        }
        .left,.right,.center{
            /* border: 1px solid black; */
            height: 100%;
        }
        .left{
            width: 2%;
            background-color: navy;
            border-radius: 30px;
            
        }
        .center{
            width: 63%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: whitesmokey;
        }
        .right{
            height: 100%;
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .center>h1{
            font-size: 125px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-left: 10px;
            padding-bottom: 20px;
            color: navy;
            
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .top{
            height: 30%;
            width: 100%;
            /* border: 1px solid black; */
            
        }
        .bottom{
            height: 70%;
            width: 100%;
            /* border: 1px solid black; */
        }
        .topin{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .circle{
            height: 125px;
            width: 125px;
            right: 270px;
            border: 5px solid navy;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 80px;
        }
        img{
            height: 100%;
            width: 100%;
            border: 1px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
       .bottom>h1{
        text-align: center;
        }
        
        .button{
            height: 20%;
            /* border: 1px solid black; */
            align-items: center;
            display: flex;
            justify-content: space-evenly
        }
        .button1{
            border-radius: 20px;
            color: white;
            height: 50%;
            width: 40%;
            background-color: navy;
            text-align: center;
            line-height: 30px;
           
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(purple,red,yellow,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-linkedin {
            color: blue;
        }
        .fa-github{
            color: violet;
        }
        .fa-behance{
            color: blue;
        }
    </style>
</head>
<body>
   <div class="con">
    <div class="box">
        <div class="left"></div>
        <div class="center">
            <h1>Profile Card UI UX Design</h1>
        </div>
        <div class="right">
            <div class="top">
                <div class="topin">
                    <div class="circle"> <img src="image3.png" alt="" height="100px"></div>
                </div>
            </div>
            <div class="bottom">
                <h1>Website Developer</h1>
                <h1>Dezyne Ècole College</h1>
                <h1>BCA 1st Year</h1>
                <div class="icon">
                <i class="fa fa-brands fa-facebook fa-2x" ></i>
                <i class="fa fa-brands fa-instagram fa-2x"></i>
                <i class="fa fa-brands fa-github fa-2x"></i>
                <i class="fa fa-brands fa-linkedin fa-2x"></i>
                <i class="fa fa-brands fa-behance fa-2x"></i>
            </div>
            <div class="button">
                <div class="button1">Subscribe</div>
                <div class="button1">Message</div>
            </div>
            <div class="icon">
                <i class="fa fa-Solid fa-heart fa-2x" ></i>60.4k
                <i class="fa fa-Solid fa-comment fa-2x"></i>20k
                <i class="fa fa-Solid fa-share fa-2x"></i>12.6k
            </div>
        </div>
        </div>
       
    </div>
   </div>
                 

</body>
</html>
